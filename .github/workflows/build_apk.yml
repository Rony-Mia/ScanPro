name: Generate ScanPro APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # গ্র্যাডল এবং র্যাপার অটোমেটিক তৈরি করার জন্য এটি ব্যবহার করা হয়েছে
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper

    - name: Build Debug APK
      run: gradle assembleDebug # এখানে gradlew এর বদলে সরাসরি gradle ব্যবহার করা হয়েছে
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ScanPro-App
        path: app/build/outputs/apk/debug/*.apk
